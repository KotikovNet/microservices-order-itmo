server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/order_db}
    username: ${DB_USERNAME:orders}
    password: ${DB_PASSWORD:orders}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
services:
  user-url: ${USER_SERVICE_URL:http://localhost:8081}
  notification-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8083}
http:
  connect-timeout: ${HTTP_CONNECT_TIMEOUT:1s}
  read-timeout: ${HTTP_READ_TIMEOUT:2s}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
